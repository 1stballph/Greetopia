<style>
  :root{--navy:#17398C;--pink:#EE3F8A;--blue:#0070E0;--ink:#1d2340;--muted:#6b7190;--line:#ece6f0;--bg:#fff7fa}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100dvh;
       background:linear-gradient(180deg,#fff 0%,var(--bg) 60%,#f3f6ff 100%)}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px
        calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:16px}
  header{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  header img{width:112px;height:112px}
  header p{font-family:'Kalam',cursive;color:var(--navy);font-size:18px}
  h1{font-size:21px;text-align:center}
  .lede{color:var(--muted);text-align:center;font-size:14.5px;line-height:1.5}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;
        box-shadow:0 8px 24px rgba(23,57,140,.06)}
  .pinrow{display:flex;gap:8px}
  input{flex:1;font:600 22px 'Inter',sans-serif;letter-spacing:.3em;text-align:center;padding:12px;
        border:1.5px solid var(--line);border-radius:14px;outline:none;color:var(--navy)}
  input:focus{border-color:var(--pink)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;
       padding:13px 18px;font:700 15px 'Inter',sans-serif;cursor:pointer;text-decoration:none;
       background:var(--blue);color:#fff}
  .btn.pink{background:var(--pink)}
  .btn.quiet{background:#f1f3fa;color:var(--navy)}
  .btn:disabled{opacity:.5}
  .msg{text-align:center;font-size:14px;line-height:1.5;min-height:20px}
  .msg.err{color:#c0264f} .msg.wait{color:var(--navy)}
  .items{display:flex;flex-direction:column;gap:14px}
  .item{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;
        box-shadow:0 8px 24px rgba(23,57,140,.06)}
  .item img{display:block;width:100%;height:auto;background:#f3f3f7;min-height:120px}
  .item .bar{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .item .bar b{flex:1;font-size:15px}
  .tip{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
  .spin{width:16px;height:16px;border:2.5px solid #c9d3f2;border-top-color:var(--navy);border-radius:50%;
        display:inline-block;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  footer{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>

  <footer>Greetopia · Thank you for celebrating with us!</footer>
</div>

<script>
/* Same /exec URL as index.html. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwpIg9O4iA-jCMN2HWIVMFgnwnl_piIRfpL6AokEOwjfJE5Oros6bxvdqKOWGa9FD8QCw/exec';

async function api(action, payload){
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({ action: action }, payload || {})) });
  const raw = await res.text();
  let j; try { j = JSON.parse(raw); } catch (e) { throw new Error('The server is busy. Please try again in a moment.'); }
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j.data;
}
function logHit(p){
  try {
    const body = JSON.stringify(Object.assign({ action:'logDownload' }, p));
    if (navigator.sendBeacon) navigator.sendBeacon(API_URL, new Blob([body], { type:'text/plain;charset=utf-8' }));
    else fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body, keepalive:true });
  } catch (e) {}
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function msg(t, cls, spin){ const m = document.getElementById('msg');
  m.className = 'msg ' + (cls || ''); m.innerHTML = (spin ? '<span class="spin"></span>' : '') + esc(t); }

let timer = null;
function load(pin){
  clearTimeout(timer);
  msg('Opening your pictures…', 'wait', true);
  document.getElementById('list').innerHTML = '';
  api('getPhotosByPin', { pin: pin }).then(r => {
    if (!r || !r.ok){
      if (r && r.needPayment){
        msg(r.message || 'Your payment is still being verified.', 'wait', true);
        timer = setTimeout(() => load(pin), 10000);          // opens by itself once approved
        return;
      }
      msg((r && r.message) || 'No pictures found for that PIN.', 'err');
      document.getElementById('ask').style.display = 'block';
      return;
    }
    document.getElementById('ask').style.display = 'none';
    msg('Here you go! Save each picture to your phone.', '');
    document.getElementById('tip').style.display = 'block';
    logHit({ pin: pin, event:'OPEN' });
    const list = document.getElementById('list');
    (r.items || []).forEach(it => {
      const d = document.createElement('div');
      d.className = 'item';
      const name = it.kind === 'COLLAGE' ? 'Your card' : it.label;
      d.innerHTML = '<img loading="lazy" alt="" src="' + esc(it.url) + '=w1200">' +
        '<div class="bar"><b>' + esc(name) + '</b>' +
        '<a class="btn" target="_blank" rel="noopener" href="' + esc(it.downloadUrl) + '">Download</a></div>';
      d.querySelector('a').addEventListener('click', () =>
        logHit({ pin: pin, event:'FILE', kind: it.kind, label: it.label, fileId: it.fileId || '' }));
      list.appendChild(d);
    });
  }).catch(e => {
    msg(e.message + ' — retrying…', 'err');
    timer = setTimeout(() => load(pin), 6000);
  });
}
function openPin(){
  const pin = document.getElementById('pin').value.replace(/\D/g, '');
  if (pin.length !== 6){ msg('Please enter all 6 digits of your PIN.', 'err'); return; }
  history.replaceState(null, '', '?pin=' + pin);
  load(pin);
}
(function start(){
  const pin = (new URLSearchParams(location.search).get('pin') || '').replace(/\D/g, '');
  if (pin.length === 6){ document.getElementById('pin').value = pin; load(pin); }
  else document.getElementById('ask').style.display = 'block';
})();
</script>
</body>
</html>
